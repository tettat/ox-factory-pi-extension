<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc" class="run still" style="--step:.72s"><title id="title">牛马轻快跑步</title><desc id="desc">戴圆框眼镜、系围巾的小牛和小马。减少动态效果时静止。</desc><style> .ink{stroke:#514737;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .body{transform-origin:105px 131px;animation:bounce var(--step) ease-in-out infinite} .leg{transform-origin:0px 0px;animation:stride var(--step) ease-in-out infinite}.rear{animation-delay:calc(var(--step) * -.5)} .tail{transform-origin:56px 116px;animation:tail 1s ease-in-out infinite alternate} .head{transform-origin:133px 100px;animation:nod var(--step) ease-in-out infinite} .ear{transform-origin:136px 55px;animation:ear 2.4s ease-in-out infinite} .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s linear infinite} .dust{animation:dust var(--step) linear infinite}.ground{animation:ground .65s linear infinite} .horse{--delay:-.17s}.horse .body{animation-delay:var(--delay)} .fast .body{animation-name:sprint}.fast .leg{animation-name:gallop} .graze .body{animation:breathe 3s ease-in-out infinite}.graze .leg{animation:none} .graze .head{animation:graze 6s ease-in-out infinite}.graze .horse .head{animation-delay:-2s} .graze .jaw{animation:chew .45s ease-in-out infinite}.graze .grass-bite{animation:chew .45s ease-in-out infinite} .graze .dust,.graze .ground{display:none}.grass{display:none}.graze .grass{display:block} @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} @keyframes sprint{0%,100%{transform:translateY(0) rotate(3deg)}45%{transform:translateY(-10px) rotate(1deg)}} @keyframes stride{0%,100%{transform:rotate(-23deg)}50%{transform:rotate(23deg)}} @keyframes gallop{0%,100%{transform:rotate(-39deg)}50%{transform:rotate(35deg)}} @keyframes nod{50%{transform:rotate(-3deg)}} @keyframes tail{to{transform:rotate(17deg)}} @keyframes ear{0%,75%,100%{transform:rotate(0)}82%{transform:rotate(-10deg)}} @keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.1)}} @keyframes dust{0%{opacity:0;transform:translate(8px,0) scale(.7)}30%{opacity:.4}100%{opacity:0;transform:translate(-20px,-7px) scale(1.1)}} @keyframes ground{to{transform:translateX(-36px)}} @keyframes breathe{50%{transform:translateY(1px)}} @keyframes graze{0%,12%,92%,100%{transform:translateY(5px) rotate(0)}28%,80%{transform:translateY(43px) rotate(46deg)}} @keyframes chew{50%{transform:translate(1px,1.6px)}} @media(prefers-reduced-motion:reduce){*{animation:none!important}.dust,.ground{display:none}} .still *{animation:none!important}.still .dust,.still .ground{display:none} .graze.still .head{transform:translateY(43px) rotate(46deg)} </style><path d="M78 200h180m117 0h180" stroke="#d2c9b0" stroke-width="1.5" fill="none"/><g class="ground" stroke="#b7b09e" opacity=".4" stroke-linecap="round"><path d="M103 208h22m98-3h20m170 3h23m91-3h15"/></g><g class="cow" transform="translate(63 9)"><ellipse cx="111" cy="190" rx="74" ry="5" fill="#d9d1b9" opacity=".45" stroke="none"/><g class="dust" stroke="none" fill="#b8a889"><circle cx="37" cy="183" r="5"/><circle cx="24" cy="181" r="3"/><circle cx="13" cy="185" r="2"/></g><g class="body ink"><g class="tail"><path d="M56 116Q26 104 25 131" fill="none"/><path d="M25 127q-9 7-5 15 10-2 10-11" fill="#7b6957"/></g><g transform="translate(77 139)"><g class="leg rear"><path d="M-6 0L-5 28Q-3 35 5 34L10 33 6 26 7 0" fill="#ded7bf"/><path d="M-5 27L-6 36Q1 40 13 35L9 28Z" fill="#605145"/><path d="M3 31l1 5" fill="none" stroke="#a39178" stroke-width="1.2"/></g></g><g transform="translate(133 139)"><g class="leg "><path d="M-6 0L-5 28Q-3 35 5 34L10 33 6 26 7 0" fill="#ded7bf"/><path d="M-5 27L-6 36Q1 40 13 35L9 28Z" fill="#605145"/><path d="M3 31l1 5" fill="none" stroke="#a39178" stroke-width="1.2"/></g></g><path d="M58 109Q74 91 110 101l34 10q13 6 10 29-2 17-39 18-47 2-59-17-9-17 2-32" fill="#fff8e6"/><path d="M66 106q27-10 23 20-11 12-29 3m46 19q3-22 23-16l9 19" fill