<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173e35"><meta name="color-scheme" content="light dark"><meta name="description" content="牛马工厂手机工作台：查看员工、继续对话、管理任务和接收结果。">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>牛马工厂 · 随身工作台</title>
</head><body>
<a class="skip-link" href="#content">跳到工作区</a>
<header class="app-header"><a class="brand" href="/" aria-label="牛马工厂，返回总览"><span class="brand-mark" aria-hidden="true">牛</span><span>牛马工厂<small>随身工作台</small></span></a><span id="connection" role="status" class="connection">正在连接</span></header>
<main>
<section id="login" hidden><div class="intro"><span class="eyebrow">YOUR FACTORY, ALWAYS WITH YOU</span><h1>人在路上，<br>工厂在手上。</h1><p>随时继续对话，安排下一件事。<br>每一步进展，都有迹可循。</p><div class="intro-tags"><span>员工对话</span><span>任务看板</span><span>结果回传</span></div></div>
<form id="login-form" class="panel login-panel"><span class="eyebrow">WELCOME BACK</span><h2>连接你的工厂</h2><p id="login-status" class="muted" role="status" aria-live="polite">正在检查中转连接…</p><label><span id="login-code-label">一次性配对码</span><span class="password-field"><input id="pair-code" aria-labelledby="login-code-label" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="120" placeholder="输入管理员生成的配对码"><button type="button" id="show-password" class="text-button" hidden aria-label="显示登录密码" aria-pressed="false">显示</button></span></label><label>这台手机的名称<input id="phone-name" name="name" autocomplete="username" maxlength="80" value="我的手机" placeholder="例如：我的 iPhone"></label><button class="primary" type="submit">安全连接 <span aria-hidden="true">↗</span></button><p class="privacy-note">加密连接 · 不暴露本机端口<br>凭证只用于工厂，不用于登录服务器。</p></form></section>
<section id="workspace" hidden><div id="banner" class="banner" role="status" hidden></div><div class="toolbar"><label><span class="eyebrow">当前工厂</span><select id="device" aria-label="当前设备"><option>等待设备连接</option></select></label><button id="refresh" class="icon-button" aria-label="刷新工厂状态" title="刷新"><span aria-hidden="true">↻</span></button></div><div class="sync-line"><span id="sync-status" aria-live="off">等待同步</span><span id="scope-status"></span></div><div id="content" tabindex="-1"></div></section>
<div id="toast" role="status" aria-live="polite" hidden></div><noscript><div class="panel">请允许 JavaScript 后使用手机工作台。此页面不会在后台自动提交任务。</div></noscript></main>
<nav id="nav" aria-label="主导航" hidden><button data-tab="home"><span class="nav-icon" data-icon="home"></span><span>总览</span></button><button data-tab="projects"><span class="nav-icon" data-icon="projects"></span><span>项目</span></button><button data-tab="workers"><span class="nav-icon" data-icon="workers"></span><span>员工</span></button><button data-tab="tasks"><span class="nav-icon" data-icon="tasks"></span><span>任务</span></button><button data-tab="activity"><span class="nav-icon" data-icon="activity"></span><span>动态</span><span id="pending-badge" class="nav-badge" hidden></span></button><button data-tab="usage"><span class="nav-icon" data-icon="usage"></span><span>用量</span></button><button data-tab="settings"><span class="nav-icon" data-icon="settings"></span><span>设置</span></button></nav>
<dialog id="dialog" aria-label="操作详情"><button class="close icon-button" id="close-dialog" aria-label="关闭详情">×</button><div id="dialog-body"></div></dialog><script type="module" src="/app.js"></script></body></html>
