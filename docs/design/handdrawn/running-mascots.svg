<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="title desc">
<title id="title">牛马一起轻快跑步</title><desc id="desc">戴眼镜的小牛与小马原地跑步；减少动态效果设置下静止。</desc>
<style>
.line{stroke:#454338;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.runner{animation:bob .52s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.horse{animation-delay:-.26s}.leg{transform-box:fill-box;transform-origin:50% 0%;animation:stride .52s ease-in-out infinite alternate}.back{animation-delay:-.52s}.tail{transform-box:fill-box;transform-origin:0% 0%;animation:swish .52s ease-in-out infinite alternate}
.dash{animation:ground .75s linear infinite}.second{animation-delay:-.35s}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-7px) rotate(1deg)}}
@keyframes stride{from{transform:rotate(-29deg)}to{transform:rotate(29deg)}}
@keyframes swish{to{transform:rotate(-17deg)}}
@keyframes ground{from{transform:translateX(20px);opacity:0}40%{opacity:.55}to{transform:translateX(-30px);opacity:0}}
@media(prefers-reduced-motion:reduce){.runner,.leg,.tail,.dash{animation:none}.dash{opacity:.35}}
</style>
<g fill="none" stroke="#a8a48d" stroke-width="2" stroke-linecap="round"><path d="M90 204h195m50 0h220"/><path class="dash" d="M90 211h35m120 4h22m100-4h32"/><path class="dash second" d="M158 218h25m310-2h30"/></g>
